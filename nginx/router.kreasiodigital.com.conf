# Mini Inference Router — fronts the docker container on 127.0.0.1:4000.
#  - TLS is terminated by Cloudflare (flexible) or by certbot after running:
#      sudo certbot --nginx -d router.kreasiodigital.com
#  - SSE: buffering must stay off or streamed answers arrive in bursts.

server {
    listen 80;
    listen [::]:80;
    server_name router.kreasiodigital.com;

    # --- CLOUDFLARE REAL IP RESTORATION (house pattern, see inngest site) ---
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Everything (console + API + SSE) is served by the container.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: no buffering, generous read window (tier B timeouts are 20s,
        # streams can last longer than a typical page request).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        client_max_body_size 2m; # gateway bodyLimit is 1 MiB
    }
}